function init(){if(c)return;c=new(window.AudioContext||window.webkitAudioContext)();
const cp=c.createDynamicsCompressor();mg=c.createGain();mg.gain.value=on?.8:0;mg.connect(cp);cp.connect(c.destination);
mb=c.createGain();mb.gain.value=.55;mb.connect(mg);sb=c.createGain();sb.gain.value=.9;sb.connect(mg);
nb=c.createBuffer(1,c.sampleRate,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
const env=(g,t,a,d,v)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)};
function osc(ty,f,t,d,v,bus,a=.005,f2){const o=c.createOscillator(),g=c.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g,t,a,d,v);o.connect(g);g.connect(bus);o.start(t);o.stop(t+a+d+.05)}
function pluck(f,t,v,bus){osc("triangle",f,t,.45,v,bus);osc("sine",f*2.01,t,.25,v*.35,bus);osc("sine",f*3.98,t,.12,v*.15,bus)}

function nz(t,d,v,ty,fr){const s=c.createBufferSource(),g=c.createGain(),f=c.createBiquadFilter();s.buffer=nb;f.type=ty;f.frequency.value=fr;env(g,t,.002,d,v);s.connect(f);f.connect(g);g.connect(mb);s.start(t,Math.random()*.5,d+.05)}
const kick=t=>osc("sine",150,t,.14,.9,mb,.002,45),dung=t=>osc("sine",190,t,.2,.6,mb,.003,110),hat=(t,v)=>nz(t,.04,v,"highpass",7000),tak=t=>{nz(t,.09,.5,"bandpass",1800);osc("triangle",220,t,.06,.3,mb)};
function tick(t,s){const p=TR[cur];if(!p)return;const bar=(s>>4)&3,k=s&15,sh=p.sh,e=60/p.bpm/2;
 if(p.dr){if(k%4==0)kick(t);if(k==4||k==12)tak(t);if(k==7||k==14)dung(t);if(k%2==0)hat(t,k%4==2?.18:.1)}
 else{if(k==0||k==8)dung(t);if(k==12)hat(t,.12)}
 if(k%2)return;const d=p.m[(s>>1)&31],r=p.b[bar];
 if(d>=0){const f=nf(d,57+sh);lead(f,t,e*1.6,.3,mb);if(p.dr)pluck(f*2,t,.16,mb)}
 if(p.dr)bass(nf(r-(k%8==6?0:5),57+sh),t,e*.9,k%4==0?.5:.3);else if(k==0||k==8)bass(nf(r-5,57+sh),t,e*3,.35)}
function run(){while(nt<c.currentTime+.15){tick(nt,st);nt+=60/TR[cur].bpm/4;st=(st+1)&63}}

function jg(a,gap){const t=c.currentTime+.03;a.forEach((d,i)=>{const f=nf(d,57);pluck(f*2,t+i*gap,.5,sb);lead(f*2,t+i*gap,.3,.25,sb)})}
